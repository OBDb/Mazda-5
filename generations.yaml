generations:
  - name: "First Generation (CP)"
    start_year: 1999
    end_year: 2005
    description: "The first-generation Mazda Premacy was unveiled on March 9, 1999, at the Geneva Motor Show and went on sale in April 1999. It was one of the least expensive seven-seaters available at the time and was marketed as a compact multi-purpose vehicle (MPV). Available with either front or all-wheel drive, it featured four-speed automatic or five-speed manual transmissions. The second and third row seats could be folded and removed, offering flexible interior configurations. In Japan, it was sold as the Premacy, while in other markets it carried the Mazda5 name. A rebadged version was sold by Ford in some Asian markets as the Ford Ixion or Ixion MAV from 1999 until 2005 in Taiwan. The first-generation Premacy was also manufactured by China's FAW Haima Automobile as the Haima Freema until 2007. Engine options included 1.8L and 2.0L gasoline engines along with 2.0L diesel variants."

  - name: "Second Generation (CR)"
    start_year: 2005
    end_year: 2010
    description: "The second-generation Mazda5 (known as Premacy in Japan) was introduced on February 7, 2005, in Japan and mid-2005 in export markets. Built on Ford's global C1 platform, it was larger than its predecessor and replaced the Mazda MPV in most export markets. It featured three rows of seating with six passengers in North America (using three rows of two seats each) and seven passengers elsewhere using Mazda's 'Karakuri Seating System'. The middle row seats recline, slide front-to-rear, and fold flat, while the rear row also folds flat. In North America, it was powered by a 2.3L MZR four-cylinder engine producing 157-159 horsepower, paired with either a five-speed manual or four-speed automatic transmission. Other markets received 1.8L, 2.0L gasoline engines and 2.0L diesel options. A mid-cycle refresh in 2008 brought updated front bumper, wheels, rear LED lights, and interior updates including luminescent gauges and an updated radio with auxiliary input. Electronic stability control and traction control were added for 2010."

  - name: "Third Generation (CW)"
    start_year: 2010
    end_year: 2018
    description: "The third-generation Mazda5 debuted in Japan on July 1, 2010, with production beginning on May 13, 2010. It was the first vehicle to incorporate Mazda's new Nagare design language, featuring flowing curves along the front fender that extended past the wheel well onto the flanks. In Europe, engine options included a 1.6L turbo-diesel, 1.8L four-cylinder, and 2.0L four-cylinder gasoline with direct injection and Mazda's i-stop start/stop technology, all paired with a six-speed manual transmission. For the US market in 2012, Mazda offered a 2.5L four-cylinder engine with six-speed manual (base) or five-speed automatic (Touring and Grand Touring). A 2013 update introduced Skyactiv-G 2.0L engine and six-speed Skyactiv-Drive automatic transmission for improved fuel economy. While US sales ended after the 2015 model year due to sluggish demand and shifting consumer preferences toward crossovers, production continued in Japan until February 23, 2018. Canadian sales persisted through 2017. The vehicle was also sold as the Nissan Lafesta Highway Star in Japan on an OEM basis from 2011."